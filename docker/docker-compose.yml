services:

  # ── Bases de datos ──────────────────────────────────────────────────────────

  postgres-noise:
    image: postgres:16-alpine
    container_name: postgres-noise
    environment:
      POSTGRES_DB:       ${POSTGRES_NOISE_DB}
      POSTGRES_USER:     ${POSTGRES_NOISE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOISE_PASSWORD}
    volumes:
      - postgres_noise_data:/var/lib/postgresql/data
      - ../schema_noise_analytics.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NOISE_USER} -d ${POSTGRES_NOISE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - noise_data

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB:       ${POSTGRES_AUTH_DB}
      POSTGRES_USER:     ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ../schema_station_registry.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - auth_data

  # ── Auth Service ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      DB_URL:                    jdbc:postgresql://postgres-auth:5432/${POSTGRES_AUTH_DB}
      DB_USERNAME:               ${POSTGRES_AUTH_USER}
      DB_PASSWORD:               ${POSTGRES_AUTH_PASSWORD}
      STATION_JWT_SECRET:        ${STATION_JWT_SECRET}
      ADMIN_JWT_SECRET:          ${ADMIN_JWT_SECRET}
      JWT_EXPIRATION_DAYS:       ${JWT_EXPIRATION_DAYS}
      ADMIN_JWT_EXPIRATION_HOURS: ${ADMIN_JWT_EXPIRATION_HOURS}
      CORS_ALLOWED_ORIGIN:       ${CORS_ALLOWED_ORIGIN:-https://soundmonitoring.systems}
      PORT:                      8081
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED:   "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth_data
      - auth_gateway
      - service_internal

  # ── Noise Processing Backend ────────────────────────────────────────────────

  noise-processing:
    build:
      context: ../noise-processing-backend
      dockerfile: Dockerfile
    container_name: noise-processing
    environment:
      DB_URL:                   jdbc:postgresql://postgres-noise:5432/${POSTGRES_NOISE_DB}
      DB_USERNAME:              ${POSTGRES_NOISE_USER}
      DB_PASSWORD:              ${POSTGRES_NOISE_PASSWORD}
      PORT:                     8082
      AUTH_ADMIN_VALIDATE_URL:  http://auth-service:8081/admin/validate
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED:   "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
    depends_on:
      postgres-noise:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - noise_data
      - processing_gateway
      - service_internal

  # ── Ingestion API ───────────────────────────────────────────────────────────

  ingestion-api:
    build:
      context: ../ingestion-api
      dockerfile: Dockerfile
    container_name: ingestion-api
    environment:
      AUTH_SERVICE_URL:       http://auth-service:8081/auth/validate
      PROCESSING_BACKEND_URL: http://noise-processing:8082/processing/measurements
      PORT:                   8000
    depends_on:
      auth-service:
        condition: service_started
      noise-processing:
        condition: service_started
    restart: unless-stopped
    networks:
      - ingestion_gateway
      - service_internal

  # ── Dashboard API ───────────────────────────────────────────────────────────

  dashboard-api:
    build:
      context: ../dashboard-api
      dockerfile: Dockerfile
    container_name: dashboard-api
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_NOISE_USER}:${POSTGRES_NOISE_PASSWORD}@postgres-noise:5432/${POSTGRES_NOISE_DB}
      PORT:   8083
    depends_on:
      postgres-noise:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noise_data
      - dashboard_gateway

  # ── Frontend ────────────────────────────────────────────────────────────────

  dashboard-frontend:
    build:
      context: ../dashboard-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY}
    container_name: dashboard-frontend
    restart: unless-stopped
    networks:
      - frontend_gateway

  # ── Nginx (API Gateway interno) ─────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      # El Nginx de la VPS termina TLS. El gateway Docker no debe escuchar en
      # ninguna interfaz pública del host.
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - noise-processing
      - ingestion-api
      - dashboard-api
      - dashboard-frontend
    restart: unless-stopped
    networks:
      - public_ingress
      - auth_gateway
      - processing_gateway
      - ingestion_gateway
      - dashboard_gateway
      - frontend_gateway

volumes:
  postgres_noise_data:
  postgres_auth_data:

networks:
  # Única red no interna. Solo Nginx pertenece a ella y es el único contenedor
  # con un puerto publicado en el host.
  public_ingress:

  # Un enlace privado e independiente entre Nginx y cada upstream evita que los
  # servicios públicos laterales puedan comunicarse entre sí por defecto.
  auth_gateway:
    internal: true
  processing_gateway:
    internal: true
  ingestion_gateway:
    internal: true
  dashboard_gateway:
    internal: true
  frontend_gateway:
    internal: true

  # Red privada exclusiva para llamadas Ingestion -> Auth/Processing y
  # Processing -> Auth. No ofrece salida directa a Internet.
  service_internal:
    internal: true

  # PostgreSQL queda aislado del gateway y de los servicios no consumidores.
  auth_data:
    internal: true
  noise_data:
    internal: true
