x-container-security: &container-security
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Tini, habilitado con init: true, usa esta capacidad únicamente para
  # reenviar señales a los procesos hijos al detener el contenedor.
  cap_add:
    - KILL
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Bases de datos ──────────────────────────────────────────────────────────

  postgres-noise:
    <<: *container-security
    # El entrypoint oficial corrige los permisos del volumen antes de bajar al
    # usuario postgres. Limitarlo a estas capacidades evita concederle el set
    # completo por defecto.
    cap_add:
      - KILL
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres-noise
    environment:
      POSTGRES_DB:       ${POSTGRES_NOISE_DB}
      POSTGRES_USER:     ${POSTGRES_NOISE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOISE_PASSWORD}
      NOISE_PROCESSOR_DB_PASSWORD: ${NOISE_PROCESSOR_DB_PASSWORD}
      DASHBOARD_DB_PASSWORD:       ${DASHBOARD_DB_PASSWORD}
    volumes:
      - postgres_noise_data:/var/lib/postgresql/data
      - ../sql/init_noise_app_roles.sh:/docker-entrypoint-initdb.d/01-app-roles.sh:ro
      - ../schema_noise_analytics.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../sql/V5__noise_analytics_least_privilege.sql:/docker-entrypoint-initdb.d/20-least-privilege.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NOISE_USER} -d ${POSTGRES_NOISE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 200
    networks:
      - noise_data

  postgres-auth:
    <<: *container-security
    cap_add:
      - KILL
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres-auth
    environment:
      POSTGRES_DB:       ${POSTGRES_AUTH_DB}
      POSTGRES_USER:     ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      AUTH_DB_PASSWORD:  ${AUTH_DB_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ../sql/init_auth_app_role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
      - ../schema_station_registry.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../sql/V4__station_registry_least_privilege.sql:/docker-entrypoint-initdb.d/20-least-privilege.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    pids_limit: 160
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 160
    networks:
      - auth_data

  # ── Estado efímero de rate limiting ────────────────────────────────────────

  redis-rate-limit:
    <<: *container-security
    # El entrypoint oficial inicia como root y baja al usuario redis.
    # Estas son las únicas capacidades necesarias para ese cambio de UID/GID.
    cap_add:
      - KILL
      - SETGID
      - SETUID
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis-rate-limit
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    networks:
      - rate_limit_data

  # ── Auth Service ────────────────────────────────────────────────────────────

  auth-service:
    <<: *container-security
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      DB_URL:                    jdbc:postgresql://postgres-auth:5432/${POSTGRES_AUTH_DB}
      DB_USERNAME:               auth_app
      DB_PASSWORD:               ${AUTH_DB_PASSWORD}
      STATION_JWT_SECRET:        ${STATION_JWT_SECRET}
      ADMIN_JWT_SECRET:          ${ADMIN_JWT_SECRET}
      JWT_EXPIRATION_DAYS:       ${JWT_EXPIRATION_DAYS}
      ADMIN_JWT_EXPIRATION_HOURS: ${ADMIN_JWT_EXPIRATION_HOURS}
      CORS_ALLOWED_ORIGIN:       ${CORS_ALLOWED_ORIGIN:-https://soundmonitoring.systems}
      REDIS_HOST:                redis-rate-limit
      REDIS_PORT:                6379
      TRUSTED_PROXY_CIDRS:       ${AUTH_GATEWAY_SUBNET:-172.28.10.0/24}
      AUTH_TOKEN_RATE_LIMIT:     ${AUTH_TOKEN_RATE_LIMIT:-30}
      ADMIN_LOGIN_RATE_LIMIT:    ${ADMIN_LOGIN_RATE_LIMIT:-10}
      PORT:                      8081
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED:   "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-rate-limit:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    pids_limit: 160
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 160
    networks:
      - auth_data
      - rate_limit_data
      - auth_gateway
      - service_internal

  # ── Noise Processing Backend ────────────────────────────────────────────────

  noise-processing:
    <<: *container-security
    build:
      context: ../noise-processing-backend
      dockerfile: Dockerfile
    container_name: noise-processing
    environment:
      DB_URL:                   jdbc:postgresql://postgres-noise:5432/${POSTGRES_NOISE_DB}
      DB_USERNAME:              noise_writer
      DB_PASSWORD:              ${NOISE_PROCESSOR_DB_PASSWORD}
      PORT:                     8082
      AUTH_ADMIN_VALIDATE_URL:  http://auth-service:8081/admin/validate
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED:   "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
    depends_on:
      postgres-noise:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=96m,mode=1777
    pids_limit: 180
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 640M
          pids: 180
    networks:
      - noise_data
      - processing_gateway
      - service_internal

  # ── Ingestion API ───────────────────────────────────────────────────────────

  ingestion-api:
    <<: *container-security
    build:
      context: ../ingestion-api
      dockerfile: Dockerfile
    container_name: ingestion-api
    environment:
      AUTH_SERVICE_URL:       http://auth-service:8081/auth/validate
      PROCESSING_BACKEND_URL: http://noise-processing:8082/processing/measurements
      PORT:                   8000
    depends_on:
      auth-service:
        condition: service_started
      noise-processing:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    pids_limit: 96
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 96
    networks:
      - ingestion_gateway
      - service_internal

  # ── Dashboard API ───────────────────────────────────────────────────────────

  dashboard-api:
    <<: *container-security
    build:
      context: ../dashboard-api
      dockerfile: Dockerfile
    container_name: dashboard-api
    environment:
      DB_HOST:     postgres-noise
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_NOISE_DB}
      DB_USERNAME: dashboard_reader
      DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
      DB_POOL_SIZE: ${DASHBOARD_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DASHBOARD_DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DASHBOARD_DB_POOL_TIMEOUT_SECONDS:-3}
      DB_STATEMENT_TIMEOUT_MS: ${DASHBOARD_DB_STATEMENT_TIMEOUT_MS:-5000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://soundmonitoring.systems}
      PUBLIC_CACHE_SECONDS: ${DASHBOARD_PUBLIC_CACHE_SECONDS:-30}
      PORT:        8083
    depends_on:
      postgres-noise:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    pids_limit: 96
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 96
    networks:
      - noise_data
      - dashboard_gateway

  # ── Frontend ────────────────────────────────────────────────────────────────

  dashboard-frontend:
    <<: *container-security
    build:
      context: ../dashboard-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY}
    container_name: dashboard-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0755
      - /run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0755
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    networks:
      - frontend_gateway

  # ── Nginx (API Gateway interno) ─────────────────────────────────────────────

  nginx:
    <<: *container-security
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: nginx
    ports:
      # El Nginx de la VPS termina TLS. El gateway Docker no debe escuchar en
      # ninguna interfaz pública del host.
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - noise-processing
      - ingestion-api
      - dashboard-api
      - dashboard-frontend
    restart: unless-stopped
    cap_add:
      - KILL
      # Nginx prepara directorios tmpfs para su usuario de trabajo.
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,mode=0755
    pids_limit: 96
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 96
    networks:
      - public_ingress
      - auth_gateway
      - processing_gateway
      - ingestion_gateway
      - dashboard_gateway
      - frontend_gateway

volumes:
  postgres_noise_data:
  postgres_auth_data:

networks:
  # Única red no interna. Solo Nginx pertenece a ella y es el único contenedor
  # con un puerto publicado en el host.
  public_ingress:

  # Un enlace privado e independiente entre Nginx y cada upstream evita que los
  # servicios públicos laterales puedan comunicarse entre sí por defecto.
  auth_gateway:
    internal: true
    ipam:
      config:
        - subnet: ${AUTH_GATEWAY_SUBNET:-172.28.10.0/24}
  processing_gateway:
    internal: true
  ingestion_gateway:
    internal: true
  dashboard_gateway:
    internal: true
  frontend_gateway:
    internal: true

  # Red privada exclusiva para llamadas Ingestion -> Auth/Processing y
  # Processing -> Auth. No ofrece salida directa a Internet.
  service_internal:
    internal: true

  # PostgreSQL queda aislado del gateway y de los servicios no consumidores.
  auth_data:
    internal: true
  noise_data:
    internal: true
  rate_limit_data:
    internal: true
