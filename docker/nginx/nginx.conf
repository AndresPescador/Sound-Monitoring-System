events {
    worker_connections 1024;
}

http {

    # ── Definición de los backends ─────────────────────────────────────────────
    upstream auth_service {
        server auth-service:8081;
    }

    upstream noise_processing {
        server noise-processing:8082;
    }

    upstream ingestion_api {
        server ingestion-api:8000;
    }

    upstream dashboard_api {
        server dashboard-api:8083;
    }

    server {
        listen 80;

        # ── Health check del propio Nginx ──────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Health checks de los backends ──────────────────────────────────────────
        location = /auth/health {
            proxy_pass http://auth_service/auth/health;
            proxy_set_header Host $host;
        }

        location = /processing/health {
            proxy_pass http://noise_processing/health;
            proxy_set_header Host $host;
        }

        location = /ingest/health {
            proxy_pass http://ingestion_api/health;
            proxy_set_header Host $host;
        }

        location = /dashboard/health {
            proxy_pass http://dashboard_api/health;
            proxy_set_header Host $host;
        }

        # ── Auth Service: /auth/* ──────────────────────────────────────────────
        # Usado por:
        #   - Ingestion API → POST /auth/validate
        #   - Administrador → POST /auth/token, POST /admin/stations (auth)
        location /auth/ {
            proxy_pass         http://auth_service/auth/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Admin del Auth Service: /admin/auth/* ──────────────────────────────
        location /admin/auth/ {
            proxy_pass         http://auth_service/admin/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Noise Processing Backend: /processing/* ────────────────────────────
        # Usado por:
        #   - Ingestion API → POST /processing/measurements
        #   - Administrador → POST /admin/processing/stations
        location /processing/ {
            proxy_pass         http://noise_processing/processing/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Admin del Noise Processing: /admin/processing/* ───────────────────
        location /admin/processing/ {
            proxy_pass         http://noise_processing/admin/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Ingestion API: /ingest/* ───────────────────────────────────────────
        # Usado por las estaciones (Raspberry Pi) para enviar métricas
        location /ingest/ {
            proxy_pass         http://ingestion_api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Dashboard Backend API: /dashboard/* ───────────────────────────────
        # Usado por el frontend React para consultar métricas y agregaciones
        location /dashboard/ {
            proxy_pass         http://dashboard_api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── Dashboard Frontend: Servir archivos estáticos React ─────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
