events { worker_connections 1024; }

http {
    # El único salto anterior es el Nginx del host, que accede mediante el
    # puerto publicado en loopback. Solo se aceptan sus direcciones de bridge.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=station_token:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    upstream auth_service       { server auth-service:8081; }
    upstream noise_processing   { server noise-processing:8082; }
    upstream ingestion_api      { server ingestion-api:8000; }
    upstream dashboard_api      { server dashboard-api:8083; }
    upstream dashboard_frontend { server dashboard-frontend:8080; }

    server {
        listen 80;

        # ── Bloqueo Swagger y Actuator (segunda capa de protección) ──────────
        location ~* ^/(auth|processing)/(swagger-ui|v3/api-docs|swagger-resources|webjars|actuator) {
            return 404;
        }

        location ~* ^/(ingest|dashboard)/(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        # ── Health check del propio Nginx ─────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Endpoints estrictamente internos ──────────────────────────────────
        # Ingestion y Processing los consumen por service_internal. Nunca deben
        # ser alcanzables desde el puerto publicado del gateway.
        location ^~ /auth/validate {
            return 404;
        }

        location ^~ /auth/admin/validate {
            return 404;
        }

        location ^~ /processing/measurements {
            return 404;
        }

        # ── Emisión de JWT de estación: nunca almacenar la respuesta ─────────
        location = /auth/token {
            limit_req zone=station_token burst=10 nodelay;
            proxy_pass http://auth_service/auth/token;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
        }

        # ── Auth Service — rutas públicas de estaciones ───────────────────────
        location /auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
        }

        # ── Auth Service — rutas admin ────────────────────────────────────────
        # /auth/admin/validate queda bloqueado por la regla interna previa.
        location = /auth/admin/login {
            limit_req zone=admin_login burst=3 nodelay;
            proxy_pass http://auth_service/admin/login;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
        }

        location /auth/admin/ {
            proxy_pass http://auth_service/admin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
        }

        # ── Noise Processing — health check público y sanitizado ─────────────
        location = /processing/health {
            proxy_pass http://noise_processing/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
        }

        # ── Noise Processing — CRUD admin de estaciones ───────────────────────
        # El VPS Nginx expone /processing/admin/* con autenticación JWT.
        location /processing/admin/ {
            proxy_pass http://noise_processing/admin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
        }

        # Cualquier otra ruta de Processing es interna o inexistente.
        location /processing/ {
            return 404;
        }

        # ── Ingestion API ─────────────────────────────────────────────────────
        location /ingest/ {
            proxy_pass http://ingestion_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── Dashboard API (lectura pública) ───────────────────────────────────
        location /dashboard/ {
            proxy_pass http://dashboard_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── Frontend React (SPA) ──────────────────────────────────────────────
        location / {
            proxy_pass http://dashboard_frontend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
        }
    }
}
