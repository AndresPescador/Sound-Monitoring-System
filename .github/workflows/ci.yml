name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Los PRs nuevos pueden cancelar CI obsoleto. Un push a main no se cancela
  # porque podría interrumpir un despliegue de producción ya iniciado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth-service:
    name: Auth Service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: auth-service/pom.xml
      - name: Run tests and generate JaCoCo report
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jacoco
          path: auth-service/target/site/jacoco
          if-no-files-found: ignore

  noise-processing-backend:
    name: Noise Processing tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noise-processing-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: noise-processing-backend/pom.xml
      - name: Run tests and generate JaCoCo report
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-processing-backend-jacoco
          path: noise-processing-backend/target/site/jacoco
          if-no-files-found: ignore

  ingestion-api:
    name: Ingestion API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ingestion-api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run tests and generate coverage
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=test-results.xml
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-api-reports
          path: |
            ingestion-api/coverage.xml
            ingestion-api/htmlcov
            ingestion-api/test-results.xml
          if-no-files-found: ignore

  dashboard-api:
    name: Dashboard API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dashboard-api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run tests and generate coverage
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=test-results.xml
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-api-reports
          path: |
            dashboard-api/coverage.xml
            dashboard-api/htmlcov
            dashboard-api/test-results.xml
          if-no-files-found: ignore

  send-metrics-python:
    name: Station Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: send_metrics
    steps:
      - uses: actions/checkout@v4
      - name: Install native audio runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsndfile1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: send_metrics/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run tests and generate coverage
        run: >-
          python -m pytest -q
          --cov=scripts
          --cov=tui
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=test-results.xml
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: send-metrics-python-reports
          path: |
            send_metrics/coverage.xml
            send_metrics/htmlcov
            send_metrics/test-results.xml
          if-no-files-found: ignore

  dashboard-frontend:
    name: Dashboard frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests and generate coverage
        run: npm run test:coverage
      - name: Build production bundle
        run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-frontend-coverage
          path: dashboard-frontend/coverage
          if-no-files-found: ignore

  recorder-cpp:
    name: Continuous recorder C++ contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            pkg-config \
            libasound2-dev \
            libsndfile1-dev \
            libtomlplusplus-dev
      - name: Configure
        run: cmake -S send_metrics/recorder -B /tmp/continuous-recorder-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build /tmp/continuous-recorder-build --parallel 2
      - name: Run contract tests
        run: ctest --test-dir /tmp/continuous-recorder-build --output-on-failure

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose without starting services
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config --quiet

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - auth-service
      - noise-processing-backend
      - ingestion-api
      - dashboard-api
      - send-metrics-python
      - dashboard-frontend
      - recorder-cpp
      - compose-config
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 35
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package the release and deployment manifest
        id: package-release
        env:
          BASE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          manifest="$RUNNER_TEMP/DEPLOY_MANIFEST"
          archive_tar="$RUNNER_TEMP/sound-monitoring-release.tar"
          archive="$RUNNER_TEMP/sound-monitoring-release-${COMMIT_SHA}.tar.gz"

          declare -A selected_services=()
          database_change=false
          requires_manual_vps_setup=false

          add_all_application_services() {
            selected_services[auth-service]=1
            selected_services[noise-processing]=1
            selected_services[ingestion-api]=1
            selected_services[dashboard-api]=1
            selected_services[dashboard-frontend]=1
            selected_services[nginx]=1
          }

          if [[ "$BASE_SHA" =~ ^0+$ ]] || ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_paths="$(git ls-tree -r --name-only "$COMMIT_SHA")"
          else
            changed_paths="$(git diff --name-only "$BASE_SHA" "$COMMIT_SHA")"
          fi

          while IFS= read -r changed_path; do
            [[ -z "$changed_path" ]] && continue
            case "$changed_path" in
              schema_*.sql|sql/*)
                database_change=true
                ;;
              docker/deploy/sound-monitoring-deploy)
                requires_manual_vps_setup=true
                ;;
              README.md|AGENTS.md|.gitignore|.github/*|api-testing/*|docs/*|*/README.md|*/tests/*|*/src/test/*|*/requirements-dev.txt)
                ;;
              send_metrics/*)
                ;;
              auth-service/*)
                selected_services[auth-service]=1
                ;;
              noise-processing-backend/*)
                selected_services[noise-processing]=1
                ;;
              ingestion-api/*)
                selected_services[ingestion-api]=1
                ;;
              dashboard-api/*)
                selected_services[dashboard-api]=1
                ;;
              dashboard-frontend/*)
                selected_services[dashboard-frontend]=1
                ;;
              docker/nginx/nginx.conf)
                selected_services[nginx]=1
                ;;
              docker/docker-compose.yml)
                add_all_application_services
                ;;
              docker/.env.example|docker/README.md|docker/CD_DEPLOYMENT.md|docker/VPS_DEPLOYMENT.md|docker/SECURITY_ROTATION.md|docker/DATABASE_ROLES.md|docker/deploy/bootstrap-vps.sh|docker/nginx/*.example|docker/nginx/certbot-renewal-hook.sh)
                ;;
              *)
                add_all_application_services
                ;;
            esac
          done <<< "$changed_paths"

          ordered_services=(auth-service noise-processing ingestion-api dashboard-api dashboard-frontend nginx)
          services=()
          for service in "${ordered_services[@]}"; do
            [[ -n "${selected_services[$service]:-}" ]] && services+=("$service")
          done

          if [[ ${#services[@]} -eq 0 ]]; then
            services_csv=none
          else
            services_csv="$(IFS=,; echo "${services[*]}")"
          fi

          {
            printf 'commit_sha=%s\n' "$COMMIT_SHA"
            printf 'database_change=%s\n' "$database_change"
            printf 'requires_manual_vps_setup=%s\n' "$requires_manual_vps_setup"
            printf 'deployment_entrypoint_sha=%s\n' "$(sha256sum docker/deploy/sound-monitoring-deploy | awk '{print $1}')"
            printf 'services=%s\n' "$services_csv"
          } > "$manifest"

          git archive --format=tar --output="$archive_tar" "$COMMIT_SHA"
          tar --append --file="$archive_tar" --directory="$RUNNER_TEMP" DEPLOY_MANIFEST
          gzip --no-name --stdout "$archive_tar" > "$archive"

          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Configure SSH transport
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_DEPLOY_KEY" ]] || { echo 'Missing production secret VPS_DEPLOY_KEY.' >&2; exit 1; }
          [[ -n "$VPS_KNOWN_HOSTS" ]] || { echo 'Missing production secret VPS_KNOWN_HOSTS.' >&2; exit 1; }

          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Transfer and deploy the verified release
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_ARCHIVE: ${{ steps.package-release.outputs.archive }}
          RELEASE_CHECKSUM: ${{ steps.package-release.outputs.checksum }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" ]] || { echo 'Missing production variable VPS_HOST.' >&2; exit 1; }
          [[ -n "$VPS_PORT" ]] || { echo 'Missing production variable VPS_PORT.' >&2; exit 1; }
          [[ -n "$VPS_DEPLOY_USER" ]] || { echo 'Missing production variable VPS_DEPLOY_USER.' >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" == '/opt/sound-monitoring' ]] || { echo 'VPS_DEPLOY_PATH must be /opt/sound-monitoring.' >&2; exit 1; }
          [[ -n "$RELEASE_ARCHIVE" && -f "$RELEASE_ARCHIVE" ]] || { echo 'Release archive was not created.' >&2; exit 1; }
          [[ "$RELEASE_CHECKSUM" =~ ^[0-9a-f]{64}$ ]] || { echo 'Release archive checksum is invalid.' >&2; exit 1; }

          ssh_options=(
            -i "$RUNNER_TEMP/ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
            -p "$VPS_PORT"
          )
          remote_target="${VPS_DEPLOY_USER}@${VPS_HOST}"
          remote_archive="/tmp/sound-monitoring-release-${COMMIT_SHA}.tar.gz"

          scp "${ssh_options[@]}" "$RELEASE_ARCHIVE" "${remote_target}:${remote_archive}"
          ssh "${ssh_options[@]}" "$remote_target" \
            "sudo -n /usr/local/sbin/sound-monitoring-deploy '$COMMIT_SHA' '$remote_archive' '$RELEASE_CHECKSUM'"
