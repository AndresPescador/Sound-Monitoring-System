<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de monitoreo acústico binaural para explorar el paisaje sonoro de Bogotá mediante mapas, métricas espaciales y datos abiertos." />
    <meta name="theme-color" content="#f8fbff" />
    <link rel="icon" type="image/png" href="/assets/logo-oido-urbano.png" />
    <link rel="preload" href="/assets/bogota-binaural-station.webp" as="image" type="image/webp" />
    <title>Monitoreo Acústico Binaural | Bogotá D.C.</title>
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('sound-monitoring-theme')
          document.documentElement.dataset.theme = storedTheme === 'dark' ? 'dark' : 'light'
          document.documentElement.style.colorScheme = document.documentElement.dataset.theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#07101f' : '#f8fbff')
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
