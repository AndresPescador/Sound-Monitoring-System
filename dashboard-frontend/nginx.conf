server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Metadato de procedencia usado por el CD. No contiene secretos y no debe
    # quedar en caché para que la verificación observe la release actual.
    location = /build-info.json {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # robots.txt no es una barrera de acceso. Estas cabeceras evitan que una
    # navegación SPA hacia el panel administrativo herede metadatos indexables.
    location = /admin {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }

    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
