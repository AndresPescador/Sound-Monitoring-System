server.port=${PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# URL interna para validar tokens de admin con el Auth Service
# Solo accesible dentro de la red Docker — bloqueado en VPS Nginx
auth.admin-validate-url=${AUTH_ADMIN_VALIDATE_URL:http://nginx/auth/admin/validate}


logging.level.com.monitoreo.processing=INFO
logging.level.org.springframework.security=WARN


spring.jpa.open-in-view=false