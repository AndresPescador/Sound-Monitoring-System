server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.station-secret=${STATION_JWT_SECRET}
jwt.admin-secret=${ADMIN_JWT_SECRET}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}
jwt.admin-expiration-hours=${ADMIN_JWT_EXPIRATION_HOURS:8}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}

# Rate limiting por IP (ventana de 60s) sobre /auth/token y /admin/login
ratelimit.auth-token-per-minute=${AUTH_TOKEN_RATE_LIMIT:20}
ratelimit.admin-login-per-minute=${ADMIN_LOGIN_RATE_LIMIT:10}

logging.level.com.monitoreo.auth=INFO
logging.level.org.springframework.security=WARN
