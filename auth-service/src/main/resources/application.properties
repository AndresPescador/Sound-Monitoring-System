server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.station-secret=${STATION_JWT_SECRET}
jwt.admin-secret=${ADMIN_JWT_SECRET}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}
jwt.admin-expiration-hours=${ADMIN_JWT_EXPIRATION_HOURS:8}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}

client-ip.trusted-proxies=${TRUSTED_PROXY_CIDRS:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Rate limiting compartido por IP (ventana de 60s)
ratelimit.auth-token-per-minute=${AUTH_TOKEN_RATE_LIMIT:30}
ratelimit.admin-login-per-minute=${ADMIN_LOGIN_RATE_LIMIT:10}

# Sincronización durable de metadatos hacia Noise Processing (red interna Docker).
processing.metadata-sync-url=${PROCESSING_METADATA_SYNC_URL:http://noise-processing:8082/internal/stations/%s/metadata}
processing.station-lifecycle-url=${PROCESSING_STATION_LIFECYCLE_URL:http://noise-processing:8082/internal/stations/%s}
processing.metadata-sync-token=${STATION_METADATA_SYNC_TOKEN}
station-sync.retry-delay-ms=${STATION_SYNC_RETRY_DELAY_MS:30000}
station-sync.max-attempts=${STATION_SYNC_MAX_ATTEMPTS:8}

logging.level.com.monitoreo.auth=INFO
logging.level.org.springframework.security=WARN
