# Fuente ALSA elegida con: continuous-recorder devices --json
# No usar "default" en producción: declarar el hardware concreto evita capturar
# desde una fuente distinta tras cambios de orden de tarjetas USB.
device = "hw:1,0"

# Perfil compatible con las grabaciones históricas de la estación.
sample_rate = 44100
channels = "auto" # "auto", "mono" o "stereo"
segment_seconds = 60

# process_audio.py debe vigilar exactamente output_dir.
output_dir = "/home/pi/grabaciones"
state_file = "/run/continuous-recorder/state.json"
